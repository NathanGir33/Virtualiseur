#### Installation automatique de Debian 13 pour Virtualiseur
# Utilisation : VirtualiseurVM.exe --iso debian-13-netinst.iso --disk vm.img --disk-size 20480 \
#               --preseed docs\preseed-debian.cfg
# Le VMM injecte ce fichier dans l'initrd sous /preseed.cfg et ajoute
# "auto=true priority=critical" à la ligne de commande du noyau.
# Mots de passe d'exemple : à changer avant tout usage réel.

# Langue, pays et clavier (AZERTY français).
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)

# Réseau : DHCP sur la carte virtio-net (NAT libslirp). Ne pas préremplir
# netcfg/dhcp_options : apt-setup lit sa valeur même quand le DHCP réussit,
# et « Do not configure the network » lui fait sauter le miroir réseau.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-vm
d-i netcfg/get_domain string local
d-i netcfg/dhcp_failed note
d-i hw-detect/load_firmware boolean false

# Miroir réseau deb.debian.org (accès Internet nécessaire) : la tâche
# « standard » et les outils invité (qemu-guest-agent, et spice-vdagent avec
# un bureau) s'installent depuis le dépôt, qui reste configuré ensuite.
d-i apt-setup/use_mirror boolean true
# Sans la ligne « deb cdrom: », qui ferait échouer apt-get update une fois
# l'ISO éjectée (et pendant late_command, avant que l'installateur la retire).
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Comptes.
d-i passwd/root-password password virtualiseur
d-i passwd/root-password-again password virtualiseur
d-i passwd/user-fullname string Utilisateur
d-i passwd/username string user
d-i passwd/user-password password virtualiseur
d-i passwd/user-password-again password virtualiseur
d-i user-setup/allow-password-weak boolean true

# Horloge.
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean false

# Partitionnement : tout le disque virtio (/dev/vda), une seule partition.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Paquets : système de base + utilitaires standard.
tasksel tasksel/first multiselect standard
d-i pkgsel/run_tasksel boolean true
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Chargeur : GRUB écrit sur le disque (Virtualiseur lit grub.cfg au démarrage).
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

# Fin : redémarrage automatique ; le CD est éjecté et la VM démarre sur le disque.
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
